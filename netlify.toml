[build]
  command = "npm run build"
  publish = "dist"

# Production API (Render). Keep in sync with Netlify UI env vars.
[build.environment]
  VITE_API_URL = "https://whatsapp-bussiness-platform-pgab.onrender.com"
  VITE_SOCKET_URL = "https://whatsapp-bussiness-platform-pgab.onrender.com"

# React Router (BrowserRouter) — all paths serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
