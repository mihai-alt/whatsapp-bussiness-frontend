[build]
  command = "npm run build"
  publish = "dist"

# Ensure production builds always target the Render API (even if Netlify UI env is empty)
[build.environment]
  VITE_API_URL = "https://whatsapp-bussiness-backend-vi5b.onrender.com"
  VITE_SOCKET_URL = "https://whatsapp-bussiness-backend-vi5b.onrender.com"

# React Router (BrowserRouter) — all paths serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
